name: Windows architectures
on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Architectures to build as a JSON array'
        default: '["x64","x86","arm64"]'
        required: true
      scope:
        description: 'Full native build, or managed hotkey update using verified released engines'
        type: choice
        options: [full, hotkeys, updates, controls]
        default: full
      skip_core:
        description: 'Carry a recorded pass only when core code and checks are unchanged'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.402'
      - name: Build and check native architecture
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ matrix.arch }}
          BUILD_SCOPE: ${{ inputs.scope }}
          SKIP_CORE_CHECKS: ${{ inputs.skip_core }}
        run: |
          if ($env:BUILD_SCOPE -in @('hotkeys','updates','controls')) {
            ./windows/scripts/ci-hotkeys.ps1 -Architecture $env:TARGET_ARCHITECTURE -SkipCoreChecks:($env:SKIP_CORE_CHECKS -eq 'true') -UpdatesOnly:($env:BUILD_SCOPE -eq 'updates') -ControlsOnly:($env:BUILD_SCOPE -eq 'controls')
          } else {
            ./windows/scripts/ci-windows.ps1 -Architecture $env:TARGET_ARCHITECTURE
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payload-${{ matrix.arch }}
          path: windows/dist/win-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.arch == 'x64' && inputs.scope == 'full'
        with:
          name: speech-model
          path: windows/dist/shared/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
