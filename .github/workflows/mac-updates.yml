name: Mac updater
on:
  push:
    branches: [feat/in-app-updates, fix/mac-trusted-install]
    paths: ['Sources/**', 'Tests/*Update*Tests.swift', 'project.yml', 'release.sh', 'scripts/mac_release.py', 'updates/test-vectors.json', '.github/workflows/mac-updates.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # A fresh VM with no signing keychain, separate from the release runner pool.
    runs-on: [self-hosted, macOS, ARM64, pflow-mac-test-ephemeral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test native updater
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          xcodebuild -project Yap.xcodeproj -scheme Yap -configuration Release -destination 'platform=macOS' -derivedDataPath build -only-testing:YapTests/ReleaseUpdatesTests -only-testing:YapTests/MacUpdateProcessTests CODE_SIGN_IDENTITY=- ENABLE_TESTABILITY=YES test > build-updates.log 2>&1 || { tail -60 build-updates.log; exit 1; }
          tail -20 build-updates.log
          app=build/Build/Products/Release/Yap.app
          codesign --verify --deep --strict "$app"
          bash release.sh --testing "$app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-updates-logs
          path: build-updates.log
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-development-only
          path: dist/pFlow-Mac-*-testing.dmg*
          if-no-files-found: error
          retention-days: 7
